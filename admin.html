<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ticket payments — organiser</title><style>body{margin:0;background:#141234;color:#f4e9d4;font:16px system-ui;padding:24px}main{max-width:1100px;margin:auto}input,button{font:inherit;padding:10px;border-radius:7px;border:1px solid #a98649}input{width:260px}button{cursor:pointer;background:#d8a24a;color:#241a38;font-weight:700}table{width:100%;border-collapse:collapse;margin-top:24px;background:#241a38}th,td{padding:12px;text-align:left;border-bottom:1px solid #4b3b61}td{vertical-align:top}.pending{color:#ffcf7e}.paid{color:#80d6a5}.emailed{color:#9fc5ff}@media(max-width:700px){body{padding:12px}table{font-size:13px}th,td{padding:7px}}</style><main><h1>Ticket payments</h1><p>Check Revolut for the ticket code in the transfer reference, then mark it paid and send the confirmation email.</p><p><input id="password" type="password" placeholder="Admin password"><button id="load">Open dashboard</button></p><p id="message" role="status"></p><table hidden id="table"><thead><tr><th>Code</th><th>Person</th><th>Registered</th><th>Status</th><th>Action</th></tr></thead><tbody></tbody></table></main><script>const password=document.querySelector('#password'),message=document.querySelector('#message'),table=document.querySelector('#table'),body=table.querySelector('tbody');let tickets=[];const api=(url,options={})=>fetch(url,{...options,headers:{'Authorization':'Bearer '+password.value,'content-type':'application/json',...(options.headers||{})}});async function load(){message.textContent='Loading…';let r=await api('/api/admin/tickets');let d=await r.json();if(!r.ok){message.textContent=d.error||'Could not load tickets';return}tickets=d.tickets;body.innerHTML=tickets.map(t=>`<tr><td><strong>${t.code}</strong></td><td>${safe(t.name)}<br><small>${safe(t.email)}</small></td><td>${new Date(t.created_at+'Z').toLocaleString()}</td><td class="${t.status}">${t.status}</td><td>${t.status==='pending'?`<button data-code="${t.code}" data-action="mark_paid">Mark paid</button>`:t.status==='paid'?`<button data-code="${t.code}" data-action="send_email">Send email</button>`:'Sent'}</td></tr>`).join('');table.hidden=false;message.textContent=`${tickets.length} registrations`};function safe(v){let d=document.createElement('div');d.textContent=v;return d.innerHTML}document.querySelector('#load').onclick=load;body.onclick=async e=>{let b=e.target.closest('button');if(!b)return;b.disabled=true;message.textContent='Saving…';let r=await api('/api/admin/tickets/'+b.dataset.code,{method:'PATCH',body:JSON.stringify({action:b.dataset.action})});let d=await r.json();if(!r.ok){message.textContent=d.error||'Failed';b.disabled=false;return}await load()};password.addEventListener('keydown',e=>{if(e.key==='Enter')load()});</script></html>
