<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141234">
<meta name="robots" content="noindex">
<title>Vote: Best Dressed · Asian Society</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;900&family=Karla:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
:root{--night:#141234;--cream:#f4e9d4;--muted:#b9acd0;--gold:#ffcf7e;--red:#c23318;--green:#7fd8a2}
body{min-height:100vh;background:linear-gradient(180deg,#141234,#241a38 60%,#43306b);color:var(--cream);font:16px/1.5 'Karla',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:520px;margin:0 auto;padding:26px 16px 80px}
h1{font:900 30px/1.15 'Fraunces',serif;color:var(--gold);text-align:center}
.sub{text-align:center;color:var(--muted);margin:6px 0 22px}
.card{background:rgba(46,37,70,.9);border:1px solid rgba(216,162,74,.35);border-radius:18px;padding:20px;box-shadow:0 14px 40px rgba(0,0,0,.35)}
input[type=search]{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #66567d;background:#19142c;color:var(--cream);font:inherit;font-size:17px}
button{font:inherit;cursor:pointer;border:0}
.hi{font:900 22px 'Fraunces',serif;margin-bottom:4px}
.rules{color:var(--muted);font-size:14px;margin-bottom:14px}
.list{display:grid;gap:8px;margin-top:12px}
.cand{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:14px 16px;border-radius:14px;background:#211a35;border:1.5px solid #4d3e66;color:var(--cream);font:700 17px 'Karla'}
.cand small{color:var(--muted);font-weight:400}
.cand:active{transform:scale(.98)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.link{background:none;color:var(--muted);text-decoration:underline;font-size:14px}
.back{display:block;text-align:center;margin-top:22px;color:var(--muted);font-size:14px}
.center{text-align:center;padding:10px 4px}
.big{font:900 26px/1.2 'Fraunces',serif;color:var(--gold);margin-bottom:8px}
.confirm{position:fixed;inset:0;background:rgba(8,6,24,.78);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.confirm__box{width:100%;max-width:380px;background:#2e2546;border:1px solid rgba(216,162,74,.5);border-radius:20px;padding:24px 20px;text-align:center}
.confirm__box .big{font-size:24px}
.confirm__row{display:grid;gap:10px;margin-top:18px}
.yes{padding:15px;border-radius:12px;background:linear-gradient(180deg,#e0502c,#c23318);color:#fff7ea;font:800 16px 'Karla';letter-spacing:.05em;text-transform:uppercase}
.no{padding:13px;border-radius:12px;background:rgba(255,255,255,.08);color:var(--cream);font:700 15px 'Karla'}
.msg{margin-top:14px;padding:12px 14px;border-radius:12px;background:#fde8e3;color:#7a2312;font-size:15px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#f6ecd8;color:#241a38;padding:12px 18px;border-radius:12px;font-weight:800;box-shadow:0 10px 26px rgba(0,0,0,.4);z-index:30;max-width:90vw;text-align:center}
</style>
</head>
<body>
<main>
  <h1>🏆 Best Dressed</h1>
  <p class="sub">Vote for the best outfit tonight. Votes are anonymous!</p>

  <section class="card center" id="loading"><p class="rules">Loading…</p></section>

  <!-- voted / closed -->
  <section class="card center" id="done" hidden>
    <p class="big" id="doneTitle"></p>
    <p class="rules" id="doneText"></p>
  </section>

  <!-- step 2: the ballot -->
  <section class="card" id="ballot" hidden>
    <p class="hi">Who is best dressed?</p>
    <p class="rules">Tap the name of the person you think has the best outfit. You get <b>one vote</b> and it's final.</p>
    <input id="q2" type="search" placeholder="Search names…" aria-label="Search names">
    <div class="list" id="list2"></div>
  </section>

  <a class="back" href="/">← Back to the event page</a>
</main>

<div class="confirm" id="confirm" hidden>
  <div class="confirm__box">
    <p class="big" id="confirmName"></p>
    <p class="rules" style="margin:0">Vote for this person as Best Dressed? You can't change it afterwards.</p>
    <div class="confirm__row">
      <button class="yes" id="yes" type="button">Yes, vote!</button>
      <button class="no" id="no" type="button">Cancel</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const $ = s => document.querySelector(s);
function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function toast(t) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 3000); }

/* a random id for this phone, kept in the browser, so one device = one vote */
function makeId() { const a = new Uint8Array(18); crypto.getRandomValues(a); return btoa(String.fromCharCode(...a)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
let memoryId = null;
function deviceId() {
  try { let d = localStorage.getItem('asoc_device'); if (!d) { d = makeId(); localStorage.setItem('asoc_device', d); } return d; } catch (e) {}
  const m = document.cookie.match(/(?:^|; )asoc_device=([^;]+)/);
  if (m) return m[1];
  memoryId = memoryId || makeId();
  try { document.cookie = 'asoc_device=' + memoryId + '; max-age=31536000; path=/; SameSite=Lax'; } catch (e) {}
  return memoryId;
}
const device = deviceId();
let people = [], open = true, voted = false, pending = null, timer = null;
try { localStorage.removeItem('asoc_me'); } catch (e) {} /* leftover from an older version of this page */

async function call(body) {
  const r = await fetch('/api/vote', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ device, ...body }) });
  return { ok: r.ok, d: await r.json().catch(() => ({})) };
}
function show(id) { ['loading', 'done', 'ballot'].forEach(s => $('#' + s).hidden = s !== id); }
function dupTag(p, list) { return list.filter(x => x.name.toLowerCase() === p.name.toLowerCase()).length > 1 ? ` <small>(${esc(p.code.slice(-2))})</small>` : ''; }

function render() {
  if (voted) { $('#doneTitle').textContent = 'Thanks! Your vote is in 🏆'; $('#doneText').textContent = 'Winners are announced at the end of the night.'; return show('done'); }
  if (!open) { $('#doneTitle').textContent = 'Voting is closed'; $('#doneText').textContent = 'Thanks for taking part!'; return show('done'); }
  const q = $('#q2').value.trim().toLowerCase();
  const shown = people.filter(p => !q || p.name.toLowerCase().includes(q));
  $('#list2').innerHTML = shown.length ? shown.map(p => `<button class="cand" data-code="${esc(p.code)}">${esc(p.name)}${dupTag(p, people)}</button>`).join('')
    : '<p class="rules">' + (people.length ? 'No names match.' : 'Nobody is on the list yet. Names appear as people arrive.') + '</p>';
  show('ballot');
}

async function load() {
  try {
    const { ok, d } = await call({ action: 'people' });
    if (!ok) return;
    people = d.people; open = d.open; voted = d.voted;
    if (!$('#confirm').hidden) return; // don't redraw under an open confirmation
    render();
  } catch (e) {}
}

$('#list2').onclick = e => {
  const b = e.target.closest('.cand'); if (!b) return;
  pending = people.find(p => p.code === b.dataset.code);
  if (!pending) return;
  $('#confirmName').textContent = pending.name;
  $('#confirm').hidden = false;
};
$('#no').onclick = () => { pending = null; $('#confirm').hidden = true; };
$('#yes').onclick = async () => {
  if (!pending) return;
  $('#yes').disabled = true;
  try {
    const { ok, d } = await call({ action: 'vote', candidate: pending.code });
    $('#confirm').hidden = true;
    if (ok) { voted = true; if (navigator.vibrate) navigator.vibrate(40); render(); }
    else if (d.error === 'already_voted') { voted = true; render(); toast('This phone has already voted.'); }
    else if (d.error === 'closed') { open = false; render(); }
    else toast('Could not save your vote. Try again.');
  } catch (e) { $('#confirm').hidden = true; toast('Could not reach the server. Try again.'); }
  $('#yes').disabled = false; pending = null;
};
$('#q2').oninput = render;

load();
timer = setInterval(load, 15000);
</script>
</body>
</html>
