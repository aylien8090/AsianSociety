<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#141234">
<meta name="robots" content="noindex">
<title>Team Buzzer · Asian Society</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@900&family=Karla:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none}
:root{--cream:#f4e9d4;--muted:#b9acd0;--gold:#ffcf7e}
[hidden]{display:none!important}
html,body{height:100%}
body{background:#141234;color:var(--cream);font:16px/1.4 'Karla',system-ui,sans-serif;overflow:hidden;transition:background .25s}
body.s-open{background:#10331f}
body.s-me{background:#0f4a28}
body.s-other{background:#4a1b12}
body.s-wait{background:#141234}
.wrap{height:100%;display:flex;flex-direction:column;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:40px}
.team{font:900 22px 'Fraunces',serif;color:var(--gold);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.change{background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;font-size:14px;cursor:pointer}
.score{font-weight:800;color:var(--muted)}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.buzz{width:min(78vw,52vh);height:min(78vw,52vh);border-radius:50%;border:0;cursor:pointer;
  font:900 clamp(40px,14vw,76px)/1 'Fraunces',serif;color:#fff;letter-spacing:.02em;
  background:radial-gradient(circle at 35% 30%,#ff7a5c,#d63a1c 55%,#8f1f0a);
  box-shadow:0 14px 0 #5e1305,0 24px 40px rgba(0,0,0,.5);transition:transform .06s,box-shadow .06s,filter .2s}
.buzz:active:not(:disabled){transform:translateY(10px);box-shadow:0 4px 0 #5e1305,0 8px 18px rgba(0,0,0,.5)}
.buzz:disabled{filter:grayscale(.85) brightness(.55);box-shadow:0 6px 0 #222,0 14px 24px rgba(0,0,0,.4);cursor:default}
.buzz.live{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
.status{font:900 clamp(22px,7vw,34px)/1.2 'Fraunces',serif}
.hint{color:var(--muted);font-size:16px;max-width:30ch}
.pick{display:grid;gap:10px;width:100%;max-width:420px}
.pick button{padding:18px;border-radius:16px;border:1.5px solid #66567d;background:#211a35;color:var(--cream);font:800 20px 'Karla';cursor:pointer}
.pick button:active{transform:scale(.98)}
h1{font:900 28px 'Fraunces',serif;color:var(--gold)}
.event{padding:10px 18px;border-radius:99px;font-weight:800;letter-spacing:.05em}
.event.ok{background:rgba(127,216,162,.2);color:#7fd8a2}
.event.bad{background:rgba(255,154,138,.2);color:#ff9a8a}
</style>
</head>
<body class="s-wait">
<div class="wrap">
  <div class="bar"><div class="team" id="teamName"></div><div><span class="score" id="score"></span> <button class="change" id="change" hidden>change team</button></div></div>

  <div class="mid" id="pickBox" hidden>
    <h1>Pick your team</h1>
    <div class="pick" id="pick"></div>
    <p class="hint" id="pickHint"></p>
  </div>

  <div class="mid" id="buzzBox" hidden>
    <div id="event"></div>
    <button class="buzz" id="buzz" disabled>BUZZ!</button>
    <div class="status" id="status"></div>
    <div class="hint" id="hint"></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
let state = null, myTeam = null, buzzing = false, lastBuzzResult = '', timer = null, pickNote = '', urlTried = false, claiming = false;

/* a random id for this phone, so a team can only be held by one phone at a time */
function makeId() { const a = new Uint8Array(18); crypto.getRandomValues(a); return btoa(String.fromCharCode(...a)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
let memoryId = null;
function deviceId() {
  try { let d = localStorage.getItem('asoc_buzz_device'); if (!d) { d = makeId(); localStorage.setItem('asoc_buzz_device', d); } return d; } catch (e) {}
  const m = document.cookie.match(/(?:^|; )asoc_buzz_device=([^;]+)/);
  if (m) return m[1];
  memoryId = memoryId || makeId();
  try { document.cookie = 'asoc_buzz_device=' + memoryId + '; max-age=86400; path=/; SameSite=Lax'; } catch (e) {}
  return memoryId;
}
const device = deviceId();

try { myTeam = JSON.parse(localStorage.getItem('asoc_team') || 'null'); } catch (e) {}
const urlTeam = new URLSearchParams(location.search).get('team');

function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function forgetTeam() { myTeam = null; try { localStorage.removeItem('asoc_team'); } catch (e) {} }

let openAtPerf = 0; // when the buzzers go live, on this phone's own clock (performance.now)
function applyState(s, t0, t1) {
  state = s;
  openAtPerf = (t0 + t1) / 2 + s.opensInMs; // the server worked out opensInMs about halfway through the request
}
async function poll() {
  try {
    const t0 = performance.now();
    const r = await fetch('/api/trivia?device=' + encodeURIComponent(device) + '&_=' + Date.now(), { cache: 'no-store' });
    const t1 = performance.now();
    if (r.ok) { applyState(await r.json(), t0, t1); render(); }
  } catch (e) {}
  const fast = state && (state.phase === 'open' || state.phase === 'answering');
  timer = setTimeout(poll, document.hidden ? 4000 : fast ? 700 : 1000);
}
// keeps the 3-2-1 countdown ticking smoothly
setInterval(() => { if (state && state.phase === 'open' && performance.now() < openAtPerf + 150) render(); }, 100);

async function refresh() {
  try {
    const t0 = performance.now();
    const r = await fetch('/api/trivia?device=' + encodeURIComponent(device) + '&_=' + Date.now(), { cache: 'no-store' });
    const t1 = performance.now();
    if (r.ok) applyState(await r.json(), t0, t1);
  } catch (e) {}
}
let claimedAt = 0;
// ask the server for the team; only one phone per team (unless the host allowed more)
async function pickTeam(t) {
  if (claiming) return;
  claiming = true;
  try {
    const r = await fetch('/api/trivia', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ action: 'claim', team: t.id, device }) });
    if (r.ok) {
      myTeam = { id: t.id, name: t.name }; pickNote = ''; claimedAt = performance.now();
      try { localStorage.setItem('asoc_team', JSON.stringify(myTeam)); } catch (e) {}
      lastBuzzResult = '';
      await refresh();
    } else {
      pickNote = r.status === 409 ? t.name + ' already has a phone connected. If that is a mistake, ask the host to release the team.' : 'Could not join that team. Try again.';
    }
  } catch (e) { pickNote = 'Could not reach the server. Try again.'; }
  claiming = false;
  render();
}
function setMood(cls) { document.body.className = cls; }

function render() {
  if (!state) return;
  // the saved team must still exist, and this phone must still hold it (the host can release it, or allow more phones)
  if (myTeam) {
    const t = state.teams.find(t => t.id === myTeam.id);
    if (!t) forgetTeam();
    else if (!t.multi && 'mine' in state && state.mine !== myTeam.id && performance.now() - claimedAt > 3000) { forgetTeam(); pickNote = 'The host released ' + t.name + '. Pick your team again.'; }
  }
  if (!myTeam && urlTeam && !urlTried) {
    const t = state.teams.find(t => t.name.toLowerCase() === urlTeam.toLowerCase());
    if (t) { urlTried = true; pickTeam(t); return; }
  }
  if (!myTeam) {
    $('#buzzBox').hidden = true; $('#pickBox').hidden = false; $('#change').hidden = true;
    $('#teamName').textContent = ''; $('#score').textContent = '';
    setMood('s-wait');
    $('#pick').innerHTML = state.teams.map(t => {
      const inUse = t.taken && !t.multi && state.mine !== t.id;
      return `<button data-id="${t.id}" ${inUse ? 'disabled style="opacity:.45"' : ''}>${esc(t.name)}${inUse ? ' · 📱 in use' : ''}</button>`;
    }).join('');
    $('#pickHint').textContent = pickNote || (state.teams.length ? 'One phone per team. Pick your team.' : 'Waiting for the host to add teams…');
    return;
  }
  const me = state.teams.find(t => t.id === myTeam.id);
  $('#pickBox').hidden = true; $('#buzzBox').hidden = false; $('#change').hidden = false;
  $('#teamName').textContent = me.name;
  $('#score').textContent = me.score + ' pts';

  const btn = $('#buzz'), status = $('#status'), hint = $('#hint'), ev = $('#event');
  btn.classList.remove('live');
  ev.innerHTML = '';
  const buzzed = state.buzzed;

  const waitMs = openAtPerf - performance.now();
  if (state.phase === 'open' && !me.tried && waitMs > 0) {
    setMood('s-wait'); btn.disabled = true;
    status.textContent = 'GET READY… ' + Math.ceil(waitMs / 1000); hint.textContent = 'Buzzers open for everyone at the same time.';
  } else if (state.phase === 'open' && !me.tried) {
    setMood('s-open'); btn.disabled = false; btn.classList.add('live');
    status.textContent = ''; hint.textContent = lastBuzzResult || 'Buzzers are open. Tap fast!';
  } else if (state.phase === 'open' && me.tried) {
    setMood('s-wait'); btn.disabled = true;
    status.textContent = 'Your team already had a go'; hint.textContent = 'Other teams can buzz now.';
  } else if (state.phase === 'answering' && buzzed && buzzed.id === me.id) {
    setMood('s-me'); btn.disabled = true;
    status.textContent = '🎤 YOUR TURN!'; hint.textContent = 'Answer now, or pass it to another team.';
  } else if (state.phase === 'answering' && buzzed) {
    setMood('s-other'); btn.disabled = true;
    status.textContent = buzzed.name + ' is answering'; hint.textContent = lastBuzzResult === 'won' ? '' : 'Too late this time!';
  } else {
    setMood('s-wait'); btn.disabled = true; lastBuzzResult = '';
    status.textContent = 'Get ready…'; hint.textContent = 'Wait for the next question.';
    if (state.event === 'correct' && state.eventTeam) ev.innerHTML = `<div class="event ok">✅ ${esc(state.eventTeam.name)} got it right!</div>`;
  }
  if (state.phase === 'open' && state.event === 'incorrect' && state.eventTeam) ev.innerHTML = `<div class="event bad">❌ ${esc(state.eventTeam.name)} got it wrong. Steal it!</div>`;
}

$('#pick').onclick = e => {
  const b = e.target.closest('button');
  if (!b) return;
  const t = state.teams.find(t => t.id === Number(b.dataset.id));
  if (t && !b.disabled) pickTeam(t);
};
// "change team" gives the team back so another phone (or this one) can pick again
$('#change').onclick = async () => {
  if (!myTeam) return;
  if (!confirm('Leave this team on this phone?')) return;
  const leaving = myTeam;
  forgetTeam(); pickNote = ''; urlTried = true;
  try { await fetch('/api/trivia', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ action: 'leave', team: leaving.id, device }) }); } catch (e) {}
  render();
};

async function buzz() {
  if (buzzing || !myTeam || $('#buzz').disabled || performance.now() < openAtPerf) return;
  buzzing = true;
  if (navigator.vibrate) navigator.vibrate(40);
  $('#buzz').disabled = true;
  try {
    const r = await fetch('/api/trivia', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ action: 'buzz', team: myTeam.id, device }) });
    const d = await r.json().catch(() => ({}));
    if (d.error === 'not_your_team') { const nm = myTeam.name; forgetTeam(); pickNote = nm + ' is connected on another phone. Ask the host to release it.'; }
    lastBuzzResult = d.won ? 'won' : 'late';
  } catch (e) { lastBuzzResult = ''; }
  buzzing = false;
  try { const t0 = performance.now(); const r = await fetch('/api/trivia?device=' + encodeURIComponent(device) + '&_=' + Date.now(), { cache: 'no-store' }); const t1 = performance.now(); if (r.ok) applyState(await r.json(), t0, t1); } catch (e) {}
  render();
}
// pointerdown = instant, no waiting for the finger to lift
$('#buzz').addEventListener('pointerdown', e => { e.preventDefault(); buzz(); });
document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); buzz(); } });

poll();
</script>
</body>
</html>
